# Dify Workflow DSL 基础模板
# 来源：Dify v1.16.1 实例导出
# 用途：只读真值模板，后续修改仅在副本 research-assistant.yml 上进行
# 注意：此文件中的知识库 ID、模型配置和凭据信息需从真实实例获取

version: 0.1.5
kind: app
app:
  name: Research Assistant
  mode: workflow
  icon: 🔬
  icon_type: emoji
  icon_background: '#E4FBCC'
  description: 科研辅助工作流，支持知识库检索、翻译、一般问答和澄清
  use_icon_as_answer_icon: true

workflow:
  graph:
    nodes:
      # Start 节点
      - id: start
        type: start
        data:
          type: start
          title: 开始
          variables: []
        position:
          x: 80
          y: 282

      # Task Parser LLM 节点
      - id: task-parser
        type: llm
        data:
          type: llm
          title: Task Parser
          model:
            provider: ''  # 需从真实实例获取
            name: ''
            mode: chat
            completion_params:
              temperature: 0.1
              max_tokens: 512
          prompt_template:
            - role: system
              text: |
                你是科研助手的任务解析器。将用户请求转换为结构化任务。

                输出必须是严格的 JSON 格式：
                {
                  "task_type": "knowledge_search|translation|general_qa|clarification",
                  "normalized_query": "标准化后的查询",
                  "needs_knowledge": true/false,
                  "needs_clarification": true/false,
                  "is_compound_request": true/false,
                  "reason": "判断理由"
                }

                规则：
                1. knowledge_search：用户需要查找文献、数据、研究结论
                2. translation：用户明确提供需要翻译的文本
                3. general_qa：一般性问题，不依赖特定文献
                4. clarification：请求不明确，需要补充信息
                5. 复合请求选择主要任务，设置 is_compound_request=true
            - role: user
              text: '{{#start.query#}}'
          vision:
            enabled: false
        position:
          x: 320
          y: 282

      # If/Else Router 节点
      - id: router
        type: if-else
        data:
          type: if-else
          title: 任务路由
          conditions:
            - id: condition-1
              comparison_operator: '=='
              variable_selector:
                - task-parser
                - text
              value: knowledge_search
            - id: condition-2
              comparison_operator: '=='
              variable_selector:
                - task-parser
                - text
              value: translation
            - id: condition-3
              comparison_operator: '=='
              variable_selector:
                - task-parser
                - text
              value: general_qa
          logical_operator: or
        position:
          x: 560
          y: 282

      # Knowledge Retrieval 节点
      - id: knowledge-retrieval
        type: knowledge-retrieval
        data:
          type: knowledge-retrieval
          title: 知识库检索
          dataset_ids: []  # 需从真实实例获取实际知识库 ID
          query_variable_selector:
            - task-parser
            - text
          multiple_retrieval_config:
            reranking_model:
              provider: ''  # 需从真实实例获取
              model: ''
            reranking_enable: true
            top_k: 3
            score_threshold_enabled: true
            score_threshold: 0.5
        position:
          x: 800
          y: 182

      # Evidence Gate（Code 节点）
      - id: evidence-gate
        type: code
        data:
          type: code
          title: Evidence Gate
          variables:
            - variable: retrieval_result
              value_selector:
                - knowledge-retrieval
                - result
          code_language: python3
          code: |
            def main(retrieval_result: str) -> dict:
                """判断是否有检索到证据"""
                has_evidence = bool(retrieval_result and retrieval_result.strip())
                return {
                    "has_evidence": has_evidence,
                    "status": "PASS" if has_evidence else "FAIL"
                }
          outputs:
            has_evidence:
              type: boolean
            status:
              type: string
        position:
          x: 1040
          y: 182

      # Evidence Gate If/Else
      - id: evidence-check
        type: if-else
        data:
          type: if-else
          title: 证据判断
          conditions:
            - id: check-1
              comparison_operator: '=='
              variable_selector:
                - evidence-gate
                - status
              value: PASS
          logical_operator: and
        position:
          x: 1280
          y: 182

      # RAG Answer LLM 节点
      - id: rag-answer
        type: llm
        data:
          type: llm
          title: RAG Answer
          model:
            provider: ''  # 需从真实实例获取
            name: ''
            mode: chat
            completion_params:
              temperature: 0.3
              max_tokens: 1024
          prompt_template:
            - role: system
              text: |
                你是科研助手，基于检索到的上下文回答问题。

                回答要求：
                1. 仅使用提供的上下文，不编造信息
                2. 按"已有资料支持、合理推断、尚需验证、来源"组织回答
                3. 不编造论文、作者、参数、实验结果或引用
                4. 明确标注信息来源和置信度
            - role: user
              text: |
                ## 检索到的上下文
                {{#knowledge-retrieval.result#}}

                ## 用户问题
                {{#task-parser.text#}}
          vision:
            enabled: false
        position:
          x: 1520
          y: 82

      # Translation LLM 节点
      - id: translation
        type: llm
        data:
          type: llm
          title: Translation
          model:
            provider: ''  # 需从真实实例获取
            name: ''
            mode: chat
            completion_params:
              temperature: 0.2
              max_tokens: 2048
          prompt_template:
            - role: system
              text: |
                你是专业的科研翻译助手。

                翻译要求：
                1. 保持术语、公式、变量、参数、单位、缩写和引用编号
                2. 不总结、不评价、不补充背景
                3. 不改变原文不确定性
                4. 保持原文格式和结构
            - role: user
              text: '{{#task-parser.text#}}'
          vision:
            enabled: false
        position:
          x: 800
          y: 382

      # General QA LLM 节点
      - id: general-qa
        type: llm
        data:
          type: llm
          title: General QA
          model:
            provider: ''  # 需从真实实例获取
            name: ''
            mode: chat
            completion_params:
              temperature: 0.5
              max_tokens: 1024
          prompt_template:
            - role: system
              text: |
                你是一般问答助手。

                规则：
                1. 使用自身知识回答，但不得声称内容来自知识库
                2. 遇到需要科研资料出处的问题，建议使用知识库检索
                3. 不编造来源
            - role: user
              text: '{{#task-parser.text#}}'
          vision:
            enabled: false
        position:
          x: 800
          y: 582

      # Clarification Answer 节点
      - id: clarification-answer
        type: answer
        data:
          type: answer
          title: 澄清回复
          answer: |
            您的请求需要补充信息。请提供：
            1. 具体的研究对象或主题
            2. 需要查询或翻译的内容
            3. 具体的问题描述

            {{#task-parser.text#}}
        position:
          x: 800
          y: 782

      # Evidence FAIL Answer 节点
      - id: evidence-fail-answer
        type: answer
        data:
          type: answer
          title: 证据不足回复
          answer: |
            当前知识库未检索到足以支持回答的相关证据，暂不形成确定性结论。
        position:
          x: 1520
          y: 282

      # Final Answer 节点
      - id: final-answer
        type: answer
        data:
          type: answer
          title: 最终回答
          answer: '{{#rag-answer.text#}}'
        position:
          x: 1760
          y: 82

      # Translation Answer 节点
      - id: translation-answer
        type: answer
        data:
          type: answer
          title: 翻译结果
          answer: '{{#translation.text#}}'
        position:
          x: 1040
          y: 382

      # General QA Answer 节点
      - id: general-qa-answer
        type: answer
        data:
          type: answer
          title: 问答结果
          answer: '{{#general-qa.text#}}'
        position:
          x: 1040
          y: 582

      # End 节点
      - id: end
        type: end
        data:
          type: end
          title: 结束
          outputs: []
        position:
          x: 2000
          y: 282

    edges:
      # Start -> Task Parser
      - id: edge-start-to-parser
        source: start
        target: task-parser
        sourceHandle: source
        targetHandle: target

      # Task Parser -> Router
      - id: edge-parser-to-router
        source: task-parser
        target: router
        sourceHandle: source
        targetHandle: target

      # Router -> Knowledge Retrieval (knowledge_search)
      - id: edge-router-to-knowledge
        source: router
        target: knowledge-retrieval
        sourceHandle: source
        targetHandle: target
        data:
          isInIteration: false

      # Router -> Translation (translation)
      - id: edge-router-to-translation
        source: router
        target: translation
        sourceHandle: source
        targetHandle: target
        data:
          isInIteration: false

      # Router -> General QA (general_qa)
      - id: edge-router-to-general-qa
        source: router
        target: general-qa
        sourceHandle: source
        targetHandle: target
        data:
          isInIteration: false

      # Router -> Clarification (clarification)
      - id: edge-router-to-clarification
        source: router
        target: clarification-answer
        sourceHandle: else
        targetHandle: target

      # Knowledge Retrieval -> Evidence Gate
      - id: edge-knowledge-to-gate
        source: knowledge-retrieval
        target: evidence-gate
        sourceHandle: source
        targetHandle: target

      # Evidence Gate -> Evidence Check
      - id: edge-gate-to-check
        source: evidence-gate
        target: evidence-check
        sourceHandle: source
        targetHandle: target

      # Evidence Check -> RAG Answer (PASS)
      - id: edge-check-to-rag
        source: evidence-check
        target: rag-answer
        sourceHandle: true
        targetHandle: target

      # Evidence Check -> Evidence FAIL Answer (FAIL)
      - id: edge-check-to-fail
        source: evidence-check
        target: evidence-fail-answer
        sourceHandle: false
        targetHandle: target

      # RAG Answer -> Final Answer
      - id: edge-rag-to-final
        source: rag-answer
        target: final-answer
        sourceHandle: source
        targetHandle: target

      # Translation -> Translation Answer
      - id: edge-translation-to-answer
        source: translation
        target: translation-answer
        sourceHandle: source
        targetHandle: target

      # General QA -> General QA Answer
      - id: edge-general-qa-to-answer
        source: general-qa
        target: general-qa-answer
        sourceHandle: source
        targetHandle: target

      # Final Answer -> End
      - id: edge-final-to-end
        source: final-answer
        target: end
        sourceHandle: source
        targetHandle: target

      # Translation Answer -> End
      - id: edge-translation-to-end
        source: translation-answer
        target: end
        sourceHandle: source
        targetHandle: target

      # General QA Answer -> End
      - id: edge-general-qa-to-end
        source: general-qa-answer
        target: end
        sourceHandle: source
        targetHandle: target

      # Clarification Answer -> End
      - id: edge-clarification-to-end
        source: clarification-answer
        target: end
        sourceHandle: source
        targetHandle: target

      # Evidence FAIL Answer -> End
      - id: edge-fail-to-end
        source: evidence-fail-answer
        target: end
        sourceHandle: source
        targetHandle: target

    viewport:
      x: 0
      y: 0
      zoom: 0.8

  features:
    file_upload:
      image:
        enabled: false
    opening_statement: ''
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
    speech_to_text:
      enabled: false
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false

  environment_variables: []
  conversation_variables: []
