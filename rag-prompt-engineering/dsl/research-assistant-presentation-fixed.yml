    - id: rag_answer
      type: custom
      data:
        type: llm
        title: GROUNDED RAG ANSWER
        desc: '严格基于证据生成回答:

          · Use retrieved evidence only

          · Preserve original entities and numbers

          · No unsupported completion

          · Traceable answer

          '
        model:
          provider: langgenius/mimo/mimo
          name: mimo-v2.5-pro
          mode: chat
          completion_params:
            temperature: 0.3
            top_p: 1
        prompt_template:
        - id: prompt-rag_answer
          role: system
          text: '你是科研助手，基于检索到的上下文回答问题。


            回答要求：

            1. 只依据检索证据回答，不编造信息

            2. 不得编造论文、作者、实验数据、参数或引用

            3. 证据不足时只回答有依据的部分

            4. 区分"已有资料支持"、"合理推断"和"尚需验证"

            5. 保留来源信息

            6. 如果不知道，就说不知道

            7. 根据用户问题的语言进行回答

            8. 对于模型名称、数值、参数、数据集名称、时间和论文报告的具体结果，必须使用检索证据中明确出现的原始实体或数值，不得使用模型自身知识替换、修正或补充证据中的名称或数值

            9. 如果证据中不存在所需具体事实，回答当前证据不足，不得猜测

            '
