    - id: evidence_judge_input_code
      type: custom
      data:
        type: code
        title: EVIDENCE PREPARATION
        desc: 准备证据充分性判断输入
        code_language: python3
        code: "def main(retrieval_result: list, normalized_query: str) -> dict:\n    \"\"\"准备 Evidence Judge 的输入\"\"\"\n \
          \   evidence_texts = []\n    for i, item in enumerate(retrieval_result[:4]):\n        if isinstance(item, dict):\n\
          \            content = item.get(\"content\", \"\")\n            if content:\n                evidence_texts.append(f\"\
          [证据{i+1}] {content[:1000]}\")\n\n    evidence_text = \"\\n\\n\".join(evidence_texts) if evidence_texts else \"无检索结果\"\
          \n\n    return {\n        \"judge_input\": f\"用户问题：{normalized_query}\\n\\n检索到的证据：\\n{evidence_text}\",\n      \
          \  \"has_evidence\": bool(evidence_texts)\n    }\n"
        variables:
        - variable: retrieval_result
          value_selector:
          - knowledge_retrieval
          - result
        - variable: normalized_query
          value_selector:
          - task_parse_code
          - normalized_query
        outputs:
          judge_input:
            type: string
          has_evidence:
            type: boolean
        selected: false
      position:
        x: 2400
        y: -150
      positionAbsolute:
        x: 2400
        y: -150
      width: 242
      height: 88
      selected: false
      sourcePosition: right
      targetPosition: left
      zIndex: 0
    - id: evidence_judge_llm
      type: custom
      data:
        type: llm
        title: EVIDENCE JUDGE
        desc: '证据充分性判断:

          · Relevance ≠ Sufficiency

          · 数值/模型/参数/数据集必须明确出现

          · 概述性问题需包含相关内容段落

          '
        model:
          provider: langgenius/mimo/mimo
          name: mimo-v2.5-pro
          mode: chat
          completion_params:
            temperature: 0.1
            top_p: 1
        prompt_template:
        - id: prompt-evidence_judge_system
          role: system
          text: '你是证据充分性判断节点。你只输出JSON，不输出其他内容。

            '
        - id: prompt-evidence_judge_user
          role: user
          text: '{{#evidence_judge_input_code.judge_input#}}


            【任务】

            判断上面的检索证据是否明确包含足以直接回答用户问题的信息。


            规则：

            - 不允许用自身知识补全缺失信息

            - 禁止利用模型自身知识补全

            - 如果用户询问的是数值、参数、模型名称、时间、数据集结果、地址、比较关系或特定条件下的结论，则检索内容中必须明确出现对应事实，否则返回false

            - 如果用户询问的是特定论文的研究方法、数据来源、实验结果等具体事实，检索内容中必须包含该论文的相关具体信息

            - 如果用户询问的是一般性主题、研究趋势、技术发展、研究热点等概述性问题，且检索证据中包含相关内容段落，则判定为sufficient=true

            - 如果检索证据中的表格、列表或结构化数据包含回答问题所需的信息，判定为sufficient=true

            - 如果检索证据明确包含回答问题所需信息，返回true

            - 否则返回false


            只输出JSON：{"sufficient": true} 或 {"sufficient": false}

            '
