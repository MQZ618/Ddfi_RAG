    - id: evidence_judge_parse_code
      type: custom
      data:
        type: code
        title: EVIDENCE JUDGE PARSE
        desc: 解析证据充分性判断结果
        code_language: python3
        code: "import json\nimport re\n\ndef main(evidence_judge_text: str) -> dict:\n    \"\"\"解析 Evidence Judge 的 JSON 输出\"\
          \"\"\n    try:\n        data = json.loads(evidence_judge_text)\n        sufficient = data.get(\"sufficient\", False)\n\
          \        return {\n            \"sufficient\": sufficient,\n            \"status\": \"sufficient\" if sufficient\
          \ else \"insufficient\"\n        }\n    except (json.JSONDecodeError, TypeError):\n        match = re.search(r'\\\
          {\"sufficient\"\\s*:\\s*(true|false)\\}', evidence_judge_text, re.IGNORECASE)\n        if match:\n            sufficient\
          \ = match.group(1).lower() == \"true\"\n            return {\n                \"sufficient\": sufficient,\n    \
          \            \"status\": \"sufficient\" if sufficient else \"insufficient\"\n            }\n        if '\"sufficient\"\
          : true' in evidence_judge_text or '\"sufficient\":true' in evidence_judge_text:\n            return {\"sufficient\"\
          : True, \"status\": \"sufficient\"}\n        return {\n            \"sufficient\": False,\n            \"status\"\
          : \"insufficient\"\n        }\n"
        variables:
        - variable: evidence_judge_text
          value_selector:
          - evidence_judge_llm
          - text
        outputs:
          sufficient:
            type: boolean
          status:
            type: string
        selected: false
      position:
        x: 3000
        y: -150
      positionAbsolute:
        x: 3000
        y: -150
      width: 242
      height: 88
      selected: false
      sourcePosition: right
      targetPosition: left
      zIndex: 0
