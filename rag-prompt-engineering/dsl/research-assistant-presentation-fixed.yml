        code_language: python3
        code: "def main(retrieval_result: list) -> dict:\n    \"\"\"判断检索结果是否为空\"\"\"\n    has_evidence = bool(retrieval_result\
          \ and len(retrieval_result) > 0)\n    return {\n        \"has_evidence\": has_evidence,\n        \"status\": \"\
          PASS\" if has_evidence else \"FAIL\"\n    }\n"
