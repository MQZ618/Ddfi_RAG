    - id: task_parser
      type: custom
      data:
        type: llm
        title: TASK PARSER
        desc: '识别任务类型: knowledge_search / translation / general_qa / clarification / future: model_computation'
        model:
          provider: langgenius/mimo/mimo
          name: mimo-v2.5-pro
          mode: chat
          completion_params:
            temperature: 0.1
            top_p: 1
        prompt_template:
        - id: prompt-task_parser
          role: system
          text: "你是科研辅助系统的任务解析器。\n\n你的职责不是回答用户问题，而是识别当前用户请求需要执行的任务。\n\n不得执行实际知识问答、翻译、检索或计算。\n\n允许任务类型只有：\n- knowledge_search\n\
            - translation\n- general_qa\n- clarification\n\n任务类型定义：\n\nknowledge_search：\n用户要求根据知识库、论文、技术资料、研究资料等查询、总结、比较或判断已有内容。\n\
            \ntranslation：\n用户明确要求翻译已有文本。\n\ngeneral_qa：\n用户进行一般知识问答，不明确要求使用知识库。\n\nclarification：\n任务对象、输入内容或目标不清晰，无法可靠执行。\n\
            \n如果一个请求同时包含多个任务，is_compound_request = true，V0 只选择当前最主要任务。\n\n不得虚构用户没有提出的任务。\n\n输出必须严格符合指定的 JSON 格式，不要输出任何额外解释。\n\
            \n输出格式：\n{\n  \"task_type\": \"knowledge_search|translation|general_qa|clarification\",\n  \"normalized_query\"\
            : \"标准化后的查询内容\",\n  \"needs_knowledge\": true或false,\n  \"needs_clarification\": true或false,\n  \"is_compound_request\"\
            : true或false,\n  \"reason\": \"简要判断理由\"\n}\n"
        context:
          enabled: true
          variable_selector:
          - sys
          - query
        vision:
          enabled: false
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 50
        variables: []
        selected: false
      position:
        x: 300
        y: 0
      positionAbsolute:
        x: 300
        y: 0
      width: 242
      height: 88
      selected: false
      sourcePosition: right
      targetPosition: left
      zIndex: 0
    - id: task_parse_code
      type: custom
      data:
        type: code
        title: STRUCTURED TASK
        desc: '解析任务为结构化输出: task_type, normalized_query, constraints, expected_output'
        code_language: python3
        code: "import json\n\ndef main(task_parser_text: str) -> dict:\n    \"\"\"解析 Task Parser 的 JSON 输出\"\"\"\n    try:\n\
          \        data = json.loads(task_parser_text)\n        return {\n            \"task_type\": data.get(\"task_type\"\
          , \"clarification\"),\n            \"normalized_query\": data.get(\"normalized_query\", \"\"),\n            \"needs_knowledge\"\
          : data.get(\"needs_knowledge\", False),\n            \"needs_clarification\": data.get(\"needs_clarification\",\
          \ False),\n            \"is_compound_request\": data.get(\"is_compound_request\", False),\n            \"reason\"\
          : data.get(\"reason\", \"\")\n        }\n    except (json.JSONDecodeError, TypeError):\n        return {\n     \
          \       \"task_type\": \"clarification\",\n            \"normalized_query\": \"\",\n            \"needs_knowledge\"\
          : False,\n            \"needs_clarification\": True,\n            \"is_compound_request\": False,\n            \"\
          reason\": \"JSON 解析失败\"\n        }\n"
        variables:
        - variable: task_parser_text
          value_selector:
          - task_parser
          - text
        outputs:
          task_type:
            type: string
          normalized_query:
            type: string
          needs_knowledge:
            type: boolean
          needs_clarification:
            type: boolean
          is_compound_request:
            type: boolean
          reason:
            type: string
        selected: false
      position:
        x: 600
        y: 0
      positionAbsolute:
        x: 600
        y: 0
      width: 242
      height: 88
      selected: false
      sourcePosition: right
      targetPosition: left
      zIndex: 0
