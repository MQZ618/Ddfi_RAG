[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddfi-rag-skill-runtime"
version = "0.1.0"
description = "Verifiable local registry, dispatcher, receipts, and artifacts for Ddfi RAG Skills"
requires-python = ">=3.11"

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
dify = ["requests>=2.31"]

[tool.setuptools.packages.find]
include = ["skill_runtime*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/skill_runtime"]
