      - description: Draft, restructure, or plan Nature-style manuscript sections
          and initial-submission materials from author-provided claims, results, figures,
          notes, or Chinese drafts. Use for abstracts, introductions, related work,
          methods, Results or experiments, discussions, conclusions, titles, full
          manuscript arguments, and first-submission packages such as cover letters,
          title pages, highlights, author contributions, availability or declaration
          text, and reviewer suggestions. Also use to classify Results evidence, decide
          what belongs in main text, captions, Methods or source data, or Supplementary
          Information, compress Results to the shortest sufficient evidence chain,
          prevent revision accretion, and audit paragraph necessity or claim repetition.
          Trigger on drafting a paper or section, structuring a manuscript, academic
          writing, first submission, 投稿材料、首次投稿、投稿信、标题页、亮点、作者贡献、数据可用性声明、推荐审稿人.
